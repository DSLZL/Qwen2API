name: ci

# All branches, no path filter: a regression anywhere must go red (D40 —
# docker-build.yml's path filter is exactly the trap this avoids).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
